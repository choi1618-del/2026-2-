const selSector = document.getElementById('sel-sector');
DATA.sectors.forEach(s => {
  const opt = document.createElement('option');
  opt.value = s; opt.textContent = s;
  selSector.appendChild(opt);
});

const selQS = document.getElementById('sel-q-start');
const selQE = document.getElementById('sel-q-end');
DATA.quarters.forEach(q => {
  const o1 = document.createElement('option'); o1.value = q; o1.textContent = q;
  const o2 = document.createElement('option'); o2.value = q; o2.textContent = q;
  selQS.appendChild(o1); selQE.appendChild(o2);
});
selQS.value = DATA.quarters[0];
selQE.value = DATA.quarters[DATA.quarters.length - 1];

function median(arr) {
  if (!arr.length) return null;
  const s = [...arr].sort((a,b)=>a-b);
  const mid = Math.floor(s.length / 2);
  return s.length % 2 !== 0 ? s[mid] : (s[mid - 1] + s[mid]) / 2;
}

function pearson(xs, ys) {
  const n = xs.length;
  if (n < 3) return 0;
  const mx = xs.reduce((a,b)=>a+b,0)/n;
  const my = ys.reduce((a,b)=>a+b,0)/n;
  let num=0, dx=0, dy=0;
  for (let i=0; i<n; i++) {
    num += (xs[i]-mx)*(ys[i]-my);
    dx += (xs[i]-mx)**2;
    dy += (ys[i]-my)**2;
  }
  return (dx===0 || dy===0) ? 0 : num / Math.sqrt(dx*dy);
}

function fmtPct(v) {
  return (v > 0 ? '+' : '') + v.toFixed(2) + '%';
}

function update() {
  const focusSec = selSector.value;
  const retType = document.getElementById('sel-ret-type').value;
  const opmType = document.getElementById('sel-opm-type').value;
  let qS = selQS.value, qE = selQE.value;
  if (qS > qE) { const t = qS; qS = qE; qE = t; }

  const isFullRange = (qS === DATA.quarters[0] && qE === DATA.quarters[DATA.quarters.length - 1]);

  const bySec = {};
  for (const r of DATA.q_rows) {
    if (r.quarter < qS || r.quarter > qE) continue;
    if (!bySec[r.sector]) bySec[r.sector] = [];
    bySec[r.sector].push(r);
  }

  const secStats = [];
  for (const [sec, rows] of Object.entries(bySec)) {
    rows.sort((a,b) => a.quarter.localeCompare(b.quarter));
    let cum = 1.0;
    const opmVals = [];
    for (const r of rows) {
      const rv = retType === 'vw' ? r.ret_vw : r.ret_ew;
      cum *= (1 + rv);
      const ov = opmType === 'med' ? r.opm_med_q : r.opm_vw_q;
      if (ov !== null && !isNaN(ov)) opmVals.push(ov);
    }
    let opmMean, opmStart, opmChg;
    if (isFullRange && DATA.full_ref[sec]) {
      const ref = DATA.full_ref[sec];
      opmMean = opmType === 'med' ? ref.opm_med : ref.opm_vw;
      opmStart = ref.opm_start;
      opmChg = ref.opm_end - ref.opm_start;
    } else {
      const firstOpm = opmType === 'med' ? rows[0].opm_med_q : rows[0].opm_vw_q;
      const lastOpm  = opmType === 'med' ? rows[rows.length-1].opm_med_q : rows[rows.length-1].opm_vw_q;
      if (!opmVals.length || firstOpm === null || lastOpm === null) continue;
      opmMean = opmType === 'med' ? median(opmVals) : opmVals.reduce((a,b)=>a+b,0)/opmVals.length;
      opmStart = firstOpm;
      opmChg = lastOpm - firstOpm;
    }
    secStats.push({
      sector: sec,
      cumRet: (cum - 1) * 100,
      opmMean: opmMean,
      opmStart: opmStart,
      opmChg: opmChg
    });
  }

  const xs = secStats.map(d => d.opmMean);
  const ys = secStats.map(d => d.cumRet);
  const rCorr = pearson(xs, ys);

  const sortedByOpm = [...secStats].sort((a,b) => a.opmMean - b.opmMean);
  const idx20 = Math.floor((sortedByOpm.length - 1) * 0.2);
  const idx80 = Math.ceil((sortedByOpm.length - 1) * 0.8);
  const cut20 = sortedByOpm[idx20].opmMean;
  const cut80 = sortedByOpm[idx80].opmMean;
  const q1Arr = sortedByOpm.filter(d => d.opmMean <= cut20).map(d => d.cumRet);
  const q5Arr = sortedByOpm.filter(d => d.opmMean > cut80).map(d => d.cumRet);
  const avg = arr => arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : 0;
  const q5q1 = avg(q5Arr) - avg(q1Arr);

  const medStart = median(secStats.map(d => d.opmStart));
  const gHH = [], gHL = [], gLH = [], gLL = [];
  for (const d of secStats) {
    const hiLvl = d.opmStart >= medStart;
    const upChg = d.opmChg > 0;
    if (hiLvl && upChg) gHH.push(d.cumRet);
    else if (hiLvl && !upChg) gHL.push(d.cumRet);
    else if (!hiLvl && upChg) gLH.push(d.cumRet);
    else gLL.push(d.cumRet);
  }
  const hiLvlAll = avg([...gHH, ...gHL]);
  const upChgAll = avg([...gHH, ...gLH]);

  document.getElementById('kpi-q5q1').textContent = (q5q1 >= 0 ? '+' : '') + q5q1.toFixed(2) + '%p';
  document.getElementById('kpi-corr').textContent = (rCorr >= 0 ? '+' : '') + rCorr.toFixed(3);
  document.getElementById('kpi-lvl').textContent = fmtPct(hiLvlAll);
  document.getElementById('kpi-chg').textContent = fmtPct(upChgAll);

  const fObj = secStats.find(d => d.sector === focusSec);
  if (fObj) {
    document.getElementById('lbl-sec-focus').textContent = `[${focusSec}] 누적수익률 (OPM ${fObj.opmMean.toFixed(1)}%)`;
    document.getElementById('kpi-sec').textContent = fmtPct(fObj.cumRet);
  } else {
    document.getElementById('lbl-sec-focus').textContent = '전체 업종 평균 수익률';
    document.getElementById('kpi-sec').textContent = fmtPct(avg(ys));
  }

  const dirMsg = rCorr > 0.15
    ? '영업이익률이 높은 업종일수록 주가 수익률도 유의미하게 높았습니다(양의 비례 관계).'
    : (rCorr < -0.15 ? '오히려 영업이익률이 낮았던 업종이 더 크게 반등했습니다(역의 관계).'
       : '업종별 영업이익률 수준과 주가 수익률 사이에는 뚜렷한 일방향 비례가 약했습니다.');
  const compMsg = upChgAll > hiLvlAll
    ? `원래 높았던 업종(${fmtPct(hiLvlAll)})보다 이익률이 상승한 업종(${fmtPct(upChgAll)})의 수익률이 더 높았습니다.`
    : `이익률이 상승한 업종(${fmtPct(upChgAll)})보다 원래 이익률이 높았던 업종(${fmtPct(hiLvlAll)})의 수익률이 더 높았습니다.`;
  const focusMsg = fObj
    ? ` 특히 선택하신 [${focusSec}] 업종은 평균 영업이익률 ${fObj.opmMean.toFixed(2)}%(변화 ${(fObj.opmChg>=0?'+':'')+fObj.opmChg.toFixed(2)}%p)에 누적수익률 ${fmtPct(fObj.cumRet)}를 기록했습니다.`
    : '';

  document.getElementById('verdict-text').textContent =
    `[${qS} ~ ${qE}] 기간 분석 결과, 이익률 상위 20% 업종이 하위 20%보다 평균 ${(q5q1>=0?'+':'')+q5q1.toFixed(2)}%p 앞섰습니다(피어슨 상관계수 r = ${(rCorr>=0?'+':'')+rCorr.toFixed(3)}). → ${dirMsg} 또한 ${compMsg}${focusMsg}`;

  const otherSecs = secStats.filter(d => d.sector !== focusSec);
  const traces = [{
    x: otherSecs.map(d=>d.opmMean),
    y: otherSecs.map(d=>d.cumRet),
    text: otherSecs.map(d=>`${d.sector}<br>OPM: ${d.opmMean.toFixed(1)}%<br>수익률: ${d.cumRet.toFixed(1)}%`),
    mode: 'markers',
    type: 'scatter',
    name: '기타 업종',
    marker: { size: 9, color: '#3b82f6', opacity: 0.75 }
  }];
  if (fObj) {
    traces.push({
      x: [fObj.opmMean], y: [fObj.cumRet],
      text: [`${fObj.sector} (선택 업종)`],
      mode: 'markers+text', textposition: 'top center',
      type: 'scatter', name: focusSec,
      marker: { size: 15, color: '#dc2626', symbol: 'star' }
    });
  }
  Plotly.newPlot('chart-scatter', traces, {
    title: '업종별 영업이익률(%) vs 누적 주가 수익률(%)',
    xaxis: { title: '업종 대표 영업이익률 (%)', zeroline: true },
    yaxis: { title: '누적 주가 수익률 (%)', zeroline: true },
    margin: { t: 45, l: 55, r: 20, b: 50 },
    legend: { orientation: 'h', y: -0.2 }
  }, { responsive: true });

  const zMat = [
    [avg(gLL), avg(gLH)],
    [avg(gHL), avg(gHH)]
  ];
  const textMat = [
    [`${fmtPct(avg(gLL))}<br>(${gLL.length}개 업종)`, `${fmtPct(avg(gLH))}<br>(${gLH.length}개 업종)`],
    [`${fmtPct(avg(gHL))}<br>(${gHL.length}개 업종)`, `${fmtPct(avg(gHH))}<br>(${gHH.length}개 업종)`]
  ];
  const maxAbs = Math.max(10, ...zMat.flat().map(v => Math.abs(v)));

  Plotly.newPlot('chart-heatmap', [{
    z: zMat,
    x: ['이익률 하락·정체 (ΔOPM ≤ 0)', '이익률 상승 (ΔOPM > 0)'],
    y: ['원래 이익률 낮음 (하위 50%)', '원래 이익률 높음 (상위 50%)'],
    text: textMat,
    texttemplate: '<b>%{text}</b>',
    textfont: { size: 14 },
    type: 'heatmap',
    colorscale: 'RdBu',
    reversescale: true,
    zmin: -maxAbs,
    zmax: maxAbs,
    colorbar: { title: '수익률(%)' }
  }], {
    title: '2×2 히트맵: 원래 높았던 업종 vs 이익률이 올라간 업종',
    margin: { t: 45, l: 150, r: 20, b: 55 }
  }, { responsive: true });

  const wStocks = focusSec === 'ALL'
    ? DATA.stocks.filter((_, idx) => idx % 3 === 0)
    : DATA.stocks.filter(s => s.sector === focusSec);
  const wTitle = focusSec === 'ALL'
    ? '전체 상장종목(표본) 내부: 개별 기업 영업이익률 vs 전 기간 누적수익률'
    : `[${focusSec}] 업종 내부 종목별 영업이익률 vs 누적수익률 (총 ${wStocks.length}개 종목)`;
  Plotly.newPlot('chart-within', [{
    x: wStocks.map(s=>s.opm_med),
    y: wStocks.map(s=>s.cum_ret),
    text: wStocks.map(s=>`${s.name} (${s.code})<br>OPM: ${s.opm_med}%<br>수익률: ${s.cum_ret}%`),
    mode: 'markers',
    type: 'scatter',
    marker: { size: focusSec === 'ALL' ? 6 : 10, color: '#0d9488', opacity: 0.75 }
  }], {
    title: wTitle,
    xaxis: { title: '개별 종목 영업이익률 중앙값 (%)', zeroline: true },
    yaxis: { title: '개별 종목 누적수익률 (%)', zeroline: true },
    margin: { t: 45, l: 55, r: 20, b: 50 }
  }, { responsive: true });
}

['sel-sector', 'sel-ret-type', 'sel-opm-type', 'sel-q-start', 'sel-q-end'].forEach(id => {
  document.getElementById(id).addEventListener('change', update);
});
update();
</script>
</body>
</html>
