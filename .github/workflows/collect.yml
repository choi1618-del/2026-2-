name: Daily Stock Collection

on:
  schedule:
    - cron: '30 7 * * 1-5' # KST 16:30 (월~금)
  workflow_dispatch:

# 💡 [128 에러 해결] 봇에게 파일을 저장(쓰기)할 수 있는 권한 부여
permissions:
  contents: write

jobs:
  collect-data:
    runs-on: ubuntu-latest
    
    # 💡 [시간 오류 해결] 가상 컴퓨터의 시간을 한국 시간(KST)으로 고정
    env:
      TZ: Asia/Seoul
    
    steps:
      # 💡 [버전 경고 해결] Checkout v4 사용
      - name: Checkout repository
        uses: actions/checkout@v4

      # 💡 [버전 경고 해결] Python Setup v5 사용
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Web Scraper
        env:
          NAVER_ID: ${{ secrets.NAVER_ID }}
          NAVER_PW: ${{ secrets.NAVER_PW }}
        run: python "크롤링 찐최종.py"

      - name: Commit and Push results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f *.csv
          git commit -m "자동 수집: 손해보험 주가 데이터 업데이트" || exit 0
          git push

      - name: Notify on failure
        if: failure()
        run: echo "크롤링 에러 발생! Actions 로그를 확인하세요."
        run: echo "크롤링 에러 발생! Actions 로그를 확인하세요."
